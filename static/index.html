<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>♟️ NegaMail-Chess - Play Online</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.2/chess.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #e0e0e0;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            max-width: 650px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 5px;
            background: linear-gradient(135deg, #f7971e, #ffd200);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }

        .subtitle a {
            color: #f7971e;
            text-decoration: none;
        }

        .chessboard {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            width: 400px;
            max-width: 100%;
            margin: 0 auto;
            border: 4px solid #2c2c4a;
            border-radius: 4px;
            aspect-ratio: 1;
        }

        .square {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            position: relative;
        }

        .square.light {
            background: #f0d9b5;
        }

        .square.dark {
            background: #b58863;
        }

        .square.selected {
            background: #7fc97f;
        }

        .square.highlight {
            background: rgba(255, 255, 100, 0.5);
        }

        .piece {
            pointer-events: none;
            line-height: 1;
        }

        .piece-white {
            color: #fff;
            text-shadow: 0 0 3px rgba(0, 0, 0, 0.5);
        }

        .piece-black {
            color: #000;
            text-shadow: 0 0 3px rgba(255, 255, 255, 0.3);
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 15px 0;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 24px;
            border: none;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            background: linear-gradient(135deg, #f7971e, #ffd200);
            color: #1a1a2e;
            box-shadow: 0 4px 15px rgba(247, 151, 30, 0.3);
        }

        .btn:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 25px rgba(247, 151, 30, 0.4);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #e0e0e0;
            box-shadow: none;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status {
            text-align: center;
            font-size: 1.1rem;
            padding: 12px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            margin: 10px 0;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .status.thinking {
            color: #ffd700;
            background: rgba(255, 215, 0, 0.1);
        }

        .status.checkmate {
            color: #ff6b6b;
            background: rgba(255, 107, 107, 0.1);
        }

        .status.draw {
            color: #ffd93d;
            background: rgba(255, 217, 61, 0.1);
        }

        .engine-info {
            text-align: center;
            font-size: 0.8rem;
            color: #666;
            margin-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 15px;
        }

        .engine-info span {
            color: #ffd700;
        }

        .move-history {
            max-height: 80px;
            overflow-y: auto;
            font-size: 0.8rem;
            color: #888;
            text-align: center;
            font-family: monospace;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            padding: 8px;
            margin-top: 10px;
        }

        .move-history::-webkit-scrollbar {
            width: 4px;
        }

        .move-history::-webkit-scrollbar-thumb {
            background: #f7971e;
            border-radius: 4px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 15px;
            }

            h1 {
                font-size: 1.5rem;
            }

            .btn {
                padding: 8px 16px;
                font-size: 0.85rem;
            }

            .chessboard {
                width: 300px;
            }

            .square {
                font-size: 1.6rem;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>♟️ NegaMail-Chess</h1>
        <div class="subtitle">
            <span>Engine: <strong>NegaMail v1.0</strong></span>
            <span style="margin: 0 8px;">·</span>
            <span>by <a href="https://github.com/arafat01rahman" target="_blank">ARAFAT</a></span>
        </div>

        <div id="board-container">
            <div id="board" class="chessboard"></div>
        </div>

        <div class="controls">
            <button class="btn" onclick="resetGame()">🔄 New Game</button>
            <button class="btn btn-secondary" onclick="flipBoard()">🔄 Flip Board</button>
            <button class="btn btn-secondary" id="engineMoveBtn" onclick="engineMove()">🤖 Engine Move</button>
        </div>

        <div class="status" id="status">⚪ Your turn (White)</div>
        <div class="move-history" id="moveHistory">Moves: —</div>

        <div class="engine-info">
            ⚡ Server: Render.com · 24/7 Online · <span id="engineStatus">Ready</span>
        </div>
    </div>

    <script>
        // ============================================================
        // Human vs Engine – Human plays White, Engine plays Black
        // ============================================================

        const API_URL = '/move';
        const ENGINE_DEPTH = 3;
        const HUMAN_COLOR = 'w';    // Human plays White
        const ENGINE_COLOR = 'b';   // Engine plays Black

        // Piece Unicode symbols
        const UNICODE_PIECES = {
            'K': '♔', 'Q': '♕', 'R': '♖', 'B': '♗', 'N': '♘', 'P': '♙',
            'k': '♚', 'q': '♛', 'r': '♜', 'b': '♝', 'n': '♞', 'p': '♟'
        };

        // ============================================================
        // Game State
        // ============================================================
        let game = null;
        let isEngineThinking = false;
        let isFlipped = true;
        let moveHistory = [];
        let selectedSquare = null;
        let legalMoves = [];
        let boardElement = null;

        // ============================================================
        // Initialize Board
        // ============================================================
        function initBoard() {
            game = new Chess();
            boardElement = document.getElementById('board');
            renderBoard();
            updateStatus();
            updateMoveHistory();
            document.getElementById('engineMoveBtn').disabled = false;
            console.log('✅ Board initialized – Human plays White, Engine plays Black');
        }

        // ============================================================
        // Render Board from FEN
        // ============================================================
        function renderBoard() {
            if (!boardElement || !game) return;
            boardElement.innerHTML = '';
            const fen = game.fen();
            const parts = fen.split(' ');
            const boardStr = parts[0];
            const rows = boardStr.split('/');
            const ranks = isFlipped ? [0, 1, 2, 3, 4, 5, 6, 7] : [7, 6, 5, 4, 3, 2, 1, 0];

            for (let rankIndex of ranks) {
                const row = rows[rankIndex];
                let fileIndex = 0;
                for (let i = 0; i < row.length; i++) {
                    const ch = row[i];
                    if (ch >= '1' && ch <= '8') {
                        const emptyCount = parseInt(ch);
                        for (let j = 0; j < emptyCount; j++) {
                            const square = createSquare(rankIndex, fileIndex, null);
                            boardElement.appendChild(square);
                            fileIndex++;
                        }
                    } else {
                        const square = createSquare(rankIndex, fileIndex, ch);
                        boardElement.appendChild(square);
                        fileIndex++;
                    }
                }
            }
        }

        function createSquare(rank, file, pieceChar) {
            const square = document.createElement('div');
            const isLight = (rank + file) % 2 === 0;
            square.className = `square ${isLight ? 'light' : 'dark'}`;
            const squareName = String.fromCharCode(97 + file) + (8 - rank);
            square.dataset.square = squareName;

            if (selectedSquare === squareName) square.classList.add('selected');
            if (legalMoves.includes(squareName)) square.classList.add('highlight');

            if (pieceChar) {
                const pieceSpan = document.createElement('span');
                pieceSpan.textContent = UNICODE_PIECES[pieceChar];
                const color = pieceChar === pieceChar.toUpperCase() ? 'white' : 'black';
                pieceSpan.className = `piece piece-${color}`;
                square.appendChild(pieceSpan);
            }

            square.addEventListener('click', () => onSquareClick(squareName));
            return square;
        }

        // ============================================================
        // Square Click – Only allow human's pieces
        // ============================================================
        function onSquareClick(square) {
            if (isEngineThinking) return;
            if (game.game_over()) return;
            // Only allow moves when it's human's turn
            if (game.turn() !== HUMAN_COLOR) return;

            const piece = game.get(square);

            if (selectedSquare === null) {
                // Select only if the piece belongs to the human
                if (piece && piece.color === HUMAN_COLOR) {
                    selectedSquare = square;
                    legalMoves = game.moves({ square: square, verbose: true }).map(m => m.to);
                    renderBoard();
                }
            } else {
                // Attempt move
                const move = game.move({
                    from: selectedSquare,
                    to: square,
                    promotion: 'q'
                });

                if (move) {
                    moveHistory.push(move.san);
                    selectedSquare = null;
                    legalMoves = [];
                    renderBoard();
                    updateStatus();
                    updateMoveHistory();

                    // After human move, engine moves (if not game over)
                    if (!game.game_over()) {
                        setTimeout(engineMove, 300);
                    }
                } else {
                    // If clicking on own piece, re-select
                    if (piece && piece.color === HUMAN_COLOR) {
                        selectedSquare = square;
                        legalMoves = game.moves({ square: square, verbose: true }).map(m => m.to);
                        renderBoard();
                    } else {
                        selectedSquare = null;
                        legalMoves = [];
                        renderBoard();
                    }
                }
            }
        }

        // ============================================================
        // Engine Move – Only when it's engine's turn
        // ============================================================
        async function engineMove() {
            if (isEngineThinking) return;
            if (game.game_over()) return;
            // Only allow engine move if it's engine's turn
            if (game.turn() !== ENGINE_COLOR) {
                // If it's human's turn, inform or do nothing
                document.getElementById('status').textContent = '⏳ It\'s your turn!';
                return;
            }

            isEngineThinking = true;
            const status = document.getElementById('status');
            status.textContent = '🤔 Engine thinking...';
            status.className = 'status thinking';
            document.getElementById('engineStatus').textContent = 'Thinking...';
            document.getElementById('engineMoveBtn').disabled = true;

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        fen: game.fen(),
                        depth: ENGINE_DEPTH
                    })
                });

                const data = await response.json();

                if (data.error) {
                    status.textContent = '❌ ' + data.error;
                    status.className = 'status';
                    isEngineThinking = false;
                    document.getElementById('engineStatus').textContent = 'Error';
                    document.getElementById('engineMoveBtn').disabled = false;
                    return;
                }

                if (data.move) {
                    const move = game.move(data.move);
                    if (move) {
                        moveHistory.push(move.san);
                        selectedSquare = null;
                        legalMoves = [];
                        renderBoard();
                        updateStatus();
                        updateMoveHistory();
                    }
                }

                if (data.score !== undefined) {
                    const scoreStr = data.score > 0 ? '+' + data.score / 100 : data.score / 100;
                    document.getElementById('engineStatus').textContent = `Score: ${scoreStr}`;
                }

            } catch (error) {
                console.error('API Error:', error);
                status.textContent = '❌ Connection error!';
                status.className = 'status';
                document.getElementById('engineStatus').textContent = 'Offline';
            } finally {
                isEngineThinking = false;
                document.getElementById('engineMoveBtn').disabled = false;
            }
        }

        // ============================================================
        // UI Updates
        // ============================================================
        function updateStatus() {
            const status = document.getElementById('status');

            if (game.in_checkmate()) {
                const winner = game.turn() === 'w' ? 'Black' : 'White';
                status.textContent = `🏆 Checkmate! ${winner} wins!`;
                status.className = 'status checkmate';
                document.getElementById('engineStatus').textContent = 'Game Over';
                document.getElementById('engineMoveBtn').disabled = true;
                return;
            }

            if (game.in_draw()) {
                status.textContent = '🤝 Draw!';
                status.className = 'status draw';
                document.getElementById('engineStatus').textContent = 'Game Over';
                document.getElementById('engineMoveBtn').disabled = true;
                return;
            }

            if (game.turn() === HUMAN_COLOR) {
                status.textContent = '♟️ Your turn (White)';
                status.className = 'status';
            } else {
                status.textContent = '🤖 Engine thinking...';
                status.className = 'status thinking';
                // If it's engine's turn but not thinking yet, trigger engine move
                if (!isEngineThinking) {
                    // If the engine hasn't started thinking, trigger it
                    // But we usually trigger after human move, so this is a safety net
                    if (!game.game_over()) {
                        setTimeout(engineMove, 100);
                    }
                }
            }
        }

        function updateMoveHistory() {
            const el = document.getElementById('moveHistory');
            if (moveHistory.length === 0) {
                el.textContent = 'Moves: —';
                return;
            }
            let html = 'Moves: ';
            for (let i = 0; i < moveHistory.length; i++) {
                if (i % 2 === 0) html += `${Math.floor(i / 2) + 1}. `;
                html += `${moveHistory[i]} `;
            }
            el.textContent = html;
            el.scrollTop = el.scrollHeight;
        }

        // ============================================================
        // Controls
        // ============================================================
        function resetGame() {
            game = new Chess();
            moveHistory = [];
            selectedSquare = null;
            legalMoves = [];
            isEngineThinking = false;
            renderBoard();
            updateStatus();
            updateMoveHistory();
            document.getElementById('engineStatus').textContent = 'Ready';
            document.getElementById('engineMoveBtn').disabled = false;
        }

        function flipBoard() {
            isFlipped = !isFlipped;
            selectedSquare = null;
            legalMoves = [];
            renderBoard();
        }

        // ============================================================
        // Keyboard Shortcuts
        // ============================================================
        document.addEventListener('keydown', (e) => {
            if (e.key === 'r' || e.key === 'R') resetGame();
            if (e.key === 'f' || e.key === 'F') flipBoard();
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                engineMove();
            }
        });

        // ============================================================
        // Start
        // ============================================================
        document.addEventListener('DOMContentLoaded', function () {
            console.log('📦 DOM loaded, initializing...');
            initBoard();
        });
    </script>
</body>

</html>
